om:
  parallelization_layer: MpiParallelization
  data_retrieval_layer: PsanaDataEventHandler
  processing_layer: CrystallographyProcessing

data_retrieval_layer:
  psana_calibration_directory: null
  data_sources:
    timestamp:
      type: TimestampPsana
    event_id:
      type: EventIdPsana
    detector_data:
      type: AreaDetectorPsana
      psana_name: DscCsPad 
      calibration: true
    detector_distance:
      type: EpicsVariablePsana
      psana_name: DscCsPad_z
    beam_energy:
      type: BeamEnergyFromEpicsVariablePsana

crystallography:
  data_broadcast_url: null
  responding_url: null
  data_broadcast_interval: 20
  geometry_file: cxi06216_v4-predrefine.geom
  min_num_peaks_for_hit: 8
  max_num_peaks_for_hit: 5000
  running_average_window_size: 200
  geometry_is_optimized: true
  speed_report_interval: 1
  hit_frame_sending_interval: 20
  non_hit_frame_sending_interval: 20

peakfinder8_peak_detection:
  max_num_peaks: 2048
  adc_threshold: 250.0
  minimum_snr: 6.0
  min_pixel_count: 2
  max_pixel_count: 30
  local_bg_radius: 4
  bad_pixel_map_filename: null
  bad_pixel_map_hdf5_path: /data/data
  min_res: 10
  max_res: 1000
