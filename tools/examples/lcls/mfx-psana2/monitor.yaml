om:
  parallelization_layer: MpiParallelization
  data_retrieval_layer: Psana2DataEventHandler
  processing_layer: CrystallographyProcessing

data_retrieval_layer:
  data_sources:
    timestamp:
      type: TimestampPsana2
    event_id:
      type: EventIdPsana2
    detector_data:
      type: AreaDetectorPsana2
      psana_name: jungfrau
      calibration: true
    detector_distance:
      type: EpicsVariablePsana2
      psana_name: detector_z
    beam_energy:
      type: BeamEnergyFromEpicsVariablePsana2

crystallography:
  data_broadcast_url: null
  responding_url: null
  geometry_file: jf16mgeom.geom
  min_num_peaks_for_hit: 2
  max_num_peaks_for_hit: 5000
  running_average_window_size: 200
  geometry_is_optimized: false
  speed_report_interval: 1
  data_broadcast_interval: 10
  hit_frame_sending_interval: 5
  non_hit_frame_sending_interval: 5
  peakogram_radius_bin_size: 50

peakfinder8_peak_detection:
  max_num_peaks: 2048
  adc_threshold: 100.0
  minimum_snr: 5.0
  min_pixel_count: 1
  max_pixel_count: 30
  local_bg_radius: 4
  bad_pixel_map_filename: null
  bad_pixel_map_hdf5_path: /data/data
  min_res: 80
  max_res: 800
