[project]
authors = [{name = "OM Developement Team", email = "valmar@slac.stanford.edu"}]
name = "ondamonitor"
requires-python = ">= 3.11"
version = "0.1.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description="Real-time monitoring of x-ray imaging experiments"
readme="README.md"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Natural Language :: English",
  "Intended Audience :: Science/Research",
]
dependencies = ["cython>=3.2.4,<4", "fabio>=2025.10.0,<2026", "hdf5plugin>=6.0.0,<7", "h5py", "msgpack-python>=0.5.6,<0.6", "msgpack-numpy>=0.4.8,<0.5", "pillow", "pydantic>=2.12.5,<3", "pyyaml>=6.0.3,<7", "pyzmq", "rich>=14.2.0,<15", "ruamel-yaml>=0.19.1,<0.20", "scipy", "typer>=0.21.1,<0.22", "jinja2>=3.1.6,<4", "typing-extensions", "ansi2html>=1.9.2,<2", "pyqtgraph>=0.14.0,<0.15", "ruamel-yaml-jinja2>=0.2.7,<0.3", "sortedcontainers>=2.4.0,<3", "mpi4py>=4.1.1,<5"]

[project.urls]
Homepage = "https://www.ondamonitor.com"
Repository = "httpd://github.com/omdevteam/om"

[project.scripts]
om_monitor = "om.monitor:app"
om_jungfrau_dark = "om.tools.jungfrau_dark:run"
om_jungfrau_zmq_receiver = "om.tools.jungfrau_zmq_receiver:run"

[project.gui-scripts]
om_crystallography_gui = "om.graphical_interfaces.crystallography_gui:app"
om_frame_viewer = "om.graphical_interfaces.frame_viewer:app"
om_crystallography_parameter_tweaker = "om.graphical_interfaces.crystallography_parameter_tweaker:app"
om_xes_gui = "om.graphical_interfaces.xes_gui:app"
om_swaxs_gui = "om.graphical_interfaces.swaxs_gui:app"

[build-system]
requires = ["setuptools", "numpy", "cython"]
build-backend = "setuptools.build_meta"

[tool.basedpyright]
typeCheckingMode = "strict"
venvPath = "/sdf/group/lcls/ds/tools/om/conda"
venv = "ps_20250819_miniom"

[tool.isort]
py_version = 311
profile = "black"

[tool.mypy]
show_error_codes = true
python_version = 3.11

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.psana2]
channels = ["lcls-ii"]

[tool.pixi.feature.psana1]
channels = ["lcls-i"]

[tool.pixi.pypi-dependencies]
ondamonitor = { path = ".", editable = true }

[tool.pixi.environments]
psana1 = ["psana1"]
psana2 = ["psana2"]

[tool.pixi.feature.psana2.activation]
scripts = ["activation-psana2.sh"]

[tool.pixi.feature.psana1.activation]
scripts = ["activation-psana1.sh"]

[tool.pixi.feature.psana2.dependencies]
python = "3.13.*"
psana = { version="==4.2.4", channel="lcls-ii" }
openmpi = "*"
mpi4py = "*"

[tool.pixi.feature.psana1.dependencies]
python = "3.11.*"
psana = { version="==4.0.66", channel="lcls-i" }
openmpi = "*"
mpi4py = "*"

[dependency-groups]
psana2 = ["cython>=3.2.4,<4", "fabio>=2025.10.0,<2026", "hdf5plugin>=6.0.0,<7", "h5py", "msgpack-python>=0.5.6,<0.6", "msgpack-numpy>=0.4.8,<0.5", "pillow", "pydantic>=2.12.5,<3", "pyyaml>=6.0.3,<7", "pyzmq", "rich>=14.2.0,<15", "ruamel-yaml>=0.19.1,<0.20", "scipy", "typer>=0.21.1,<0.22", "jinja2>=3.1.6,<4", "typing-extensions", "ansi2html>=1.9.2,<2", "pyqtgraph>=0.14.0,<0.15", "ruamel-yaml-jinja2>=0.2.7,<0.3", "sortedcontainers>=2.4.0,<3"]
psana1 = ["cython>=3.2.4,<4", "fabio>=2025.10.0,<2026", "hdf5plugin>=6.0.0,<7", "h5py", "msgpack-python>=0.5.6,<0.6", "msgpack-numpy>=0.4.8,<0.5", "pillow", "pydantic>=2.12.5,<3", "pyyaml>=6.0.3,<7", "pyzmq", "rich>=14.2.0,<15", "ruamel-yaml>=0.19.1,<0.20", "scipy", "typer>=0.21.1,<0.22", "jinja2>=3.1.6,<4", "typing-extensions", "ansi2html>=1.9.2,<2", "pyqtgraph>=0.14.0,<0.15", "ruamel-yaml-jinja2>=0.2.7,<0.3", "sortedcontainers>=2.4.0,<3"]

[tool.pixi.tasks]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
